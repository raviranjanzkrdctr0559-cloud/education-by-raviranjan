<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes By Raviranjan Kr.</title>
<style>
body{
font-family:Arial;
padding:20px;
background:#f4f6f9;
}
textarea{
width:100%;
height:150px;
}
button{
padding:10px;
margin-top:10px;
}
.note{
background:white;
padding:10px;
margin-top:10px;
border-radius:10px;
}
</style>
</head>
<body>

<h1>📚 Welcome Notes By Raviranjan Kr.</h1>

<textarea id="noteInput" placeholder="Write your notes here"></textarea>

<br>

<button onclick="saveNote()">Save Note</button>

<button onclick="deleteNotes()">Delete All</button>

<div id="notesContainer"></div>

<script>

function saveNote(){

let note=document.getElementById("noteInput").value;

if(note=="") return;

let notes=JSON.parse(localStorage.getItem("notes")) || [];

notes.push(note);

localStorage.setItem("notes",JSON.stringify(notes));

document.getElementById("noteInput").value="";

showNotes();
}

function showNotes(){

let notes=JSON.parse(localStorage.getItem("notes")) || [];

let output="";

for(let i=0;i<notes.length;i++){

output += "<div class='note'>"+notes[i]+"</div>";

}

document.getElementById("notesContainer").innerHTML=output;
}

function deleteNotes(){

localStorage.removeItem("notes");

showNotes();
}

showNotes();

</script>

</body>
